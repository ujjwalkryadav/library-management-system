<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= typeof title !== 'undefined' ? title : (systemSettings ? systemSettings.library_name : 'Library Management System') %></title>
  
  <!-- Google Fonts: Playfair Display (Serif) & Plus Jakarta Sans (Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Master Application Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  
  <% if (currentUser && (currentUser.role === 'ADMIN' || currentUser.role === 'EMPLOYEE')) { %>
    <link rel="stylesheet" href="/css/admin.css">
  <% } else if (currentUser && currentUser.role === 'STUDENT') { %>
    <link rel="stylesheet" href="/css/student.css">
  <% } %>
</head>
<body class="<%= currentUser ? (currentUser.role === 'ADMIN' || currentUser.role === 'EMPLOYEE' ? 'admin-theme' : 'student-theme') : 'public-theme' %> d-flex flex-column min-vh-100">
