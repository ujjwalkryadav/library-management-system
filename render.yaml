services:
  - type: web
    name: library-management-system
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: library-db
    plan: free
